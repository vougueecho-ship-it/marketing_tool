# ==============================================================================
# Nginx Virtual Host for tool.winningheaven.com
# IMPORTANT: This file is completely isolated and will NOT affect winningheaven.com
# Put this in: /etc/nginx/sites-available/tool.winningheaven.com
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name tool.winningheaven.com;

    # Maximum file upload size for large lead files (Excel / CSV)
    client_max_body_size 60M;

    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for background jobs and large list uploads
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Disable buffering for real-time logs
        proxy_buffering off;
    }
}
